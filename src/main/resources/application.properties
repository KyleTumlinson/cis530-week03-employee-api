spring.application.name=week3.restapi
spring.main.banner-mode=off

spring.datasource.url=jdbc:mysql://localhost:3306/employee_dir
spring.datasource.username=root
spring.datasource.password=Admin123!@#

# Optional but helpful
# how hibernate manages the schema on start. Automatically creates tables/entities when needed
# do not use this in enterprise
spring.jpa.hibernate.ddl-auto=update
# tells hibernate to print the queries in terminal
spring.jpa.show-sql=true
# tells hibernate to format the sql in easier to read lines with correct indentation
spring.jpa.properties.hibernate.format_sql=true